

name: Neon

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

concurrency:
  group: neon-${{ github.event.pull_request.number || github.ref }}

jobs:
  preview-branch-tests:
    name: Tests on a Neon branch
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Create Neon branch for this PR
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate + test against Neon
        env:
          TEST_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          WEBHOOK_SECRET: ci_webhook_secret_123
        run: |
          npm run db:migrate
          npm test

  delete-preview-branch:
    name: Delete Neon branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  migrate-main:
    name: Migrate Neon main branch
    if: github.event_name == 'push' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:migrate
