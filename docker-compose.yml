

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pickup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickup"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/pickup}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev_webhook_secret_change_me}
      HOLD_SECONDS: ${HOLD_SECONDS:-120}

      ENABLE_PAYMENT_SIMULATOR: ${ENABLE_PAYMENT_SIMULATOR:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,https://lucifer180.github.io}
    ports:
      - "4000:4000"

volumes:
  pgdata:
